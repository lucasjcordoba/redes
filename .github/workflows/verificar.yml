# En cada PR: las colas son válidas y las imágenes commiteadas son exactamente
# las que salen de las plantillas. Así lo que se revisa en el PR es lo que se
# publica.
name: Verificar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/verificar.mjs
      - run: npm run agenda
